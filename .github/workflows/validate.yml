name: Validate

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate manifest JSON
        run: python3 -m json.tool manifest.json > /dev/null

      - name: Parse content script
        run: node --check content.js

      - name: Build release archive
        run: bash scripts/build-release.sh

      - name: Inspect release archive
        run: unzip -l dist/chattrim-v*.zip
